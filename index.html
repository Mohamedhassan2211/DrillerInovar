<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Otago Property Explorer</title>
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <h1>Otago Property Explorer</h1>

    <calcite-button id="pick-land" width="full">تحديد الأرض من الخريطة</calcite-button>

    <calcite-label>
      1. المنطقة / الحي
      <calcite-combobox id="area" dir="ltr" placeholder="ابحث عن المنطقة" selection-mode="single-persist" disabled></calcite-combobox>
    </calcite-label>

    <calcite-label>
      2. الطريق
      <calcite-combobox id="road" dir="ltr" placeholder="ابحث عن الطريق" selection-mode="single-persist" disabled></calcite-combobox>
    </calcite-label>

    <calcite-label>
      3. العقار / قطعة الأرض
      <calcite-combobox id="land" dir="ltr" placeholder="ابحث عن العقار أو القطعة" selection-mode="single-persist" disabled></calcite-combobox>
    </calcite-label>

    <calcite-label>
      4. العنوان
      <calcite-combobox id="address" dir="ltr" placeholder="العناوين داخل الأرض" selection-mode="single-persist" disabled></calcite-combobox>
    </calcite-label>

    <calcite-button id="save-json" width="full" disabled>حفظ بيانات الأرض (JSON)</calcite-button>
    <p id="status"></p>
  </aside>

  <arcgis-map id="map" popup-component-enabled>
    <arcgis-zoom slot="top-left"></arcgis-zoom>
    <arcgis-scale-bar slot="bottom-left" unit="metric"></arcgis-scale-bar>
    <arcgis-popup slot="popup" hide-action-bar highlight-disabled></arcgis-popup>
  </arcgis-map>

  <script type="module" src="js/main.js"></script>
</body>
</html>
